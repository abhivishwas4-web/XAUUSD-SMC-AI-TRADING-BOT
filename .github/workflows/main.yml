name: CI - Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: test_token
      TELEGRAM_CHAT_ID: test_chat_id
      TWELVE_DATA_API_KEY: test_api_key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Show Python version
        run: python --version

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          else
            echo "ERROR: requirements.txt not found"
            exit 1
          fi

      - name: Compile check
        run: |
          python -m compileall src run.py

      - name: Run tests
        id: run-tests
        run: |
          set -o pipefail
          pytest -v | tee pytest_v.txt

      - name: Security / env sanity check
        run: |
          # Ensure .env is ignored
          if ! grep -qxF '.env' .gitignore 2>/dev/null; then
            echo '.env must be present in .gitignore' >&2
            exit 1
          fi

          # .env.example must exist and reference expected keys
          if [ ! -f .env.example ]; then
            echo '.env.example missing' >&2
            exit 1
          fi

          # Check .env.example contains the expected placeholders (not real secrets)
          if ! grep -q 'TELEGRAM_BOT_TOKEN' .env.example; then
            echo 'TELEGRAM_BOT_TOKEN not declared in .env.example' >&2
            exit 1
          fi
          if ! grep -q 'TWELVE_DATA_API_KEY' .env.example; then
            echo 'TWELVE_DATA_API_KEY not declared in .env.example' >&2
            exit 1
          fi

          # Heuristic secrets scan
          # This is a lightweight grep-based heuristic that does NOT print file contents,
          # only prints filenames:line matches so maintainers can manually review.
          echo "Running heuristic secrets scan (grep) — results written to secrets_grep.txt"
          { git grep -nE "(TWELVE|TWELVEDATA|TWELVE_DATA|TELEGRAM_BOT_TOKEN|TELEGRAM_CHAT_ID|API_KEY|SECRET|TOKEN)" || true; } > secrets_grep.txt
          echo "Heuristic scan complete. Top results (if any):"
          head -n 50 secrets_grep.txt || true
